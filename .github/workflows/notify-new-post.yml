name: Notify subscribers about new Blanchett Exposed articles

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blanchett-exposed-new-site-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the new website catalogue and notify subscribers
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, subprocess, sys
          from datetime import datetime

          state_path = pathlib.Path("automation/latest-post.json")
          feed_url = "https://blanchett-exposed.pages.dev/articles/index.json"
          request = urllib.request.Request(feed_url, headers={"User-Agent": "BlanchettExposedMobileReader/2.0"})
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  records = json.load(response)
          except Exception as exc:
              print(f"Could not read the new website article catalogue: {exc}")
              sys.exit(1)

          if not isinstance(records, list) or not records:
              print("The new website catalogue is empty or has an unexpected format.")
              sys.exit(1)

          def published_key(item):
              value = str(item.get("date") or "")
              try:
                  return datetime.fromisoformat(value).timestamp()
              except ValueError:
                  return 0

          eligible = [
              item for item in records
              if isinstance(item, dict) and item.get("slug") and item.get("title")
          ]
          if not eligible:
              print("No valid published article entries found.")
              sys.exit(1)

          article = max(eligible, key=published_key)
          slug = str(article["slug"]).strip()
          title = str(article["title"]).strip()
          if not slug or any(ch not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-" for ch in slug):
              print("Latest article has an unsafe or empty slug; refusing to notify.")
              sys.exit(1)

          article_url = "https://blanchett-exposed.pages.dev/articles/" + slug + "/"
          app_id = "326ce20f-b4a3-47fb-8b80-dc878f7a3fd9"
          api_key = os.environ.get("ONESIGNAL_REST_API_KEY", "").strip()
          test_notification = os.environ.get("TEST_NOTIFICATION", "false").lower() == "true"

          def send_notification(payload):
              if not api_key:
                  print("Missing GitHub Actions secret ONESIGNAL_REST_API_KEY.")
                  sys.exit(1)
              req = urllib.request.Request(
                  "https://api.onesignal.com/notifications",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "Authorization": "Key " + api_key
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
                      print("OneSignal response:", json.dumps(result))
                      if not result.get("id"):
                          print("OneSignal did not create the notification; inspect its response.")
                          sys.exit(1)
              except urllib.error.HTTPError as exc:
                  print("OneSignal rejected the notification:", exc.code, exc.read().decode("utf-8", "replace"))
                  sys.exit(1)

          if test_notification:
              send_notification({
                  "app_id": app_id,
                  "target_channel": "push",
                  "included_segments": ["All"],
                  "headings": {"en": "Blanchett Exposed"},
                  "contents": {"en": "Test notification: mobile reader connection check."},
                  "url": "https://blanchett-exposed.pages.dev/"
              })
              sys.exit(0)

          previous = None
          if state_path.exists():
              try:
                  previous = json.loads(state_path.read_text()).get("latest_article_slug")
              except Exception:
                  previous = None

          if previous is None:
              state_path.parent.mkdir(parents=True, exist_ok=True)
              state_path.write_text(json.dumps({"latest_article_slug": slug}, indent=2) + "\n")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", str(state_path)], check=True)
              subprocess.run(["git", "commit", "-m", "Initialize latest website article marker"], check=False)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
              print(f"Initialized marker at {slug}; no notification sent.")
              sys.exit(0)

          if str(previous) == slug:
              print("No new published website article.")
              sys.exit(0)

          send_notification({
              "app_id": app_id,
              "target_channel": "push",
              "included_segments": ["Subscribed Users"],
              "headings": {"en": "Blanchett Exposed"},
              "contents": {"en": "New investigation: " + title},
              "url": article_url
          })

          state_path.write_text(json.dumps({"latest_article_slug": slug}, indent=2) + "\n")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(state_path)], check=True)
          subprocess.run(["git", "commit", "-m", "Update latest website article marker"], check=False)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print(f"Notification sent for {slug}.")
          PY
