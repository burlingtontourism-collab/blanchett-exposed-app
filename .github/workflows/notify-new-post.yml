name: Notify subscribers about new WordPress articles

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push notification to subscribed devices"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wordpress-new-post-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check WordPress feed and notify subscribers
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, subprocess, sys

          state_path = pathlib.Path("automation/latest-post.json")
          feed_url = "https://public-api.wordpress.com/rest/v1.1/sites/blanchetexposed.wordpress.com/posts/?number=1"
          request = urllib.request.Request(feed_url, headers={"User-Agent": "BlanchettExposedPostNotifier/1.0"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  feed = json.load(response)
          except Exception as exc:
              print(f"Could not read WordPress feed: {exc}")
              sys.exit(1)

          posts = feed.get("posts", [])
          if not posts:
              print("No public posts found; nothing to do.")
              sys.exit(0)

          post = posts[0]
          post_id = str(post.get("ID", ""))
          title = post.get("title", "A new investigation from Blanchett Exposed")
          link = post.get("URL", "https://blanchetexposed.wordpress.com/")
          if not post_id:
              print("Latest post has no ID; refusing to send.")
              sys.exit(1)

          app_id = "326ce20f-b4a3-47fb-8b80-dc878f7a3fd9"
          api_key = os.environ.get("ONESIGNAL_REST_API_KEY", "").strip()
          test_notification = os.environ.get("TEST_NOTIFICATION", "false").lower() == "true"

          if test_notification:
              if not api_key:
                  print("Missing GitHub Actions secret ONESIGNAL_REST_API_KEY.")
                  sys.exit(1)
              payload = {
                  "app_id": app_id,
              "target_channel": "push",
                  "included_segments": ["Test Users"],
                  "headings": {"en": "Blanchett Exposed"},
                  "contents": {"en": "Test notification: push setup check."},
                  "url": "https://blanchetexposed.wordpress.com/"
              }
              req = urllib.request.Request(
                  "https://api.onesignal.com/notifications",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "Authorization": "Key " + api_key
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      result = json.load(response)
                      print("OneSignal test notification response:", json.dumps(result))
                      if not result.get("id"):
                          print("OneSignal did not create a test notification; check recipient targeting and OneSignal errors.")
                          sys.exit(1)
              except urllib.error.HTTPError as exc:
                  print("OneSignal rejected test notification:", exc.code, exc.read().decode("utf-8", "replace"))
                  sys.exit(1)
              sys.exit(0)

          state_path.parent.mkdir(parents=True, exist_ok=True)
          previous = None
          if state_path.exists():
              try:
                  previous = json.loads(state_path.read_text()).get("latest_post_id")
              except Exception:
                  previous = None

          if previous is None:
              state_path.write_text(json.dumps({"latest_post_id": post_id}, indent=2) + "\n")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", str(state_path)], check=True)
              subprocess.run(["git", "commit", "-m", "Initialize latest WordPress post marker"], check=False)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
              print(f"Initialized marker at post {post_id}; no notification sent.")
              sys.exit(0)

          if str(previous) == post_id:
              print("No new WordPress article.")
              sys.exit(0)

          app_id = "326ce20f-b4a3-47fb-8b80-dc878f7a3fd9"
          api_key = os.environ.get("ONESIGNAL_REST_API_KEY", "").strip()
          if not api_key:
              print("Missing GitHub Actions secret ONESIGNAL_REST_API_KEY.")
              sys.exit(1)

          payload = {
              "app_id": app_id,
              "target_channel": "push",
              "included_segments": ["Subscribed Users"],
              "headings": {"en": "Blanchett Exposed"},
              "contents": {"en": "New investigation: " + title},
              "url": link
          }
          req = urllib.request.Request(
              "https://api.onesignal.com/notifications",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "Authorization": "Key " + api_key
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.load(response)
                  print("OneSignal response:", json.dumps(result))
                  if not result.get("id"):
                      print("OneSignal did not create an article notification; check recipient targeting and OneSignal errors.")
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print("OneSignal rejected notification:", exc.code, exc.read().decode("utf-8", "replace"))
              sys.exit(1)

          state_path.write_text(json.dumps({"latest_post_id": post_id}, indent=2) + "\n")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(state_path)], check=True)
          subprocess.run(["git", "commit", "-m", "Update latest WordPress post marker"], check=False)
          subprocess.run(["git", "push"], check=True)
          PY
