name: Cádiz Alerta — AEMET push
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cadiz-alerta-aemet
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: cadiz-alerta-android/monitor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cadiz-alerta-android
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cadiz-alerta-android/monitor/package.json
      - name: Restore sent-alert history\n        uses: actions/cache@v4\n        with:\n          path: cadiz-alerta-android/monitor/sent-alerts.json\n          key: aemet-alert-history-${{ github.run_id }}\n          restore-keys: |\n            aemet-alert-history-\n      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check monitor script
        run: node --check monitor.js
      - name: Check AEMET and send FCM alerts
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node monitor.js
